<script>

// this method give you less features
   const owl= document.getElementById('owl')
    owl.addEventListener('click',function(e){
        e.stopPropagation();// if event listener is also applied on outside element it block it and only specific event listener of innner element will propogate
        alert("owl")
    },false)// this false here is for event propogation-bubbling(false)->(here we go inside to outside that is on click inside event will occour first ) or event capturing(true)

// image should become invisible when i click it
document.querySelector('#images').addEventListener('click',function(e){
    
    if(e.target.tagName==='IMG'){
    e.target.parentNode.remove()
    }

    // now here since i am using target,it will also remove whole ul if i click on any list


})
