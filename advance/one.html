<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>htnml Events </title>
</head>
<body style="background-color: #414141; color: aliceblue;">
   <!-- //  0	UNSENT	Client has been created. open() not called yet.
//1	OPENED	open() has been called.
//2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
//3	LOADING	Downloading; responseText holds partial data.
//4	DONE	The operation is complete. -->
</body>
<script>
    const requesturl="https://api.github.com/users/sanikasharma07"
    const xhr=new XMLHttpRequest();
    xhr.onreadystatechange=function(){// to track the request continously ,we use this and function there to ask  what to do as soon as state changes

        console.log(xhr.readyState);// this tells the current state
        if(xhr.readyState===4) console.log(this.responseText) // now the response text we are getting here is strings
          if(xhr.readyState===4){
            const followers=JSON.parse(this.responseText)// converts string in json(object)
           console.log(followers.followers)
          }
    }
    xhr.open('GET',requesturl)// open has beeen called
    xhr.send()// stage 2
    
    </script>
   </html>
