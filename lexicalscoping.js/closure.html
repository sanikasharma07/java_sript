<script>
// lets say when we click on the green button we want to change the background color to green and when we click on the orange button we want to change the background color to orange. We can do this using closures.
// so we will create a function for this
function clickHandler(color){
    return function(){
        document.body.style.backgroundColor =`${color}`;
    }// here is is imp to return a function otherwise the color change will be executed immedeately
}
greenBtn = document.querySelector(".Green");
orangeBtn = document.querySelector(".Orange");
greenBtn.addEventListener("click",clickHandler("green"));
orangeBtn.addEventListener("click",clickHandler("orange"));
